# Make sure to increase resource requests and limits before using this example in production.
# For examples with more realistic resource configuration, see
# ray-cluster.complete.large.yaml and
# ray-cluster.autoscaler.large.yaml.
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: rayservice-sample
spec:
  serviceUnhealthySecondThreshold: 900 # Config for the health check threshold for Ray Serve applications. Default value is 900.
  deploymentUnhealthySecondThreshold: 300 # Config for the health check threshold for Ray dashboard agent. Default value is 300.
  # serveConfigV2 takes a yaml multi-line scalar, which should be a Ray Serve multi-application config. See https://docs.ray.io/en/latest/serve/multi-app.html.
  # Only one of serveConfig and serveConfigV2 should be used.
  serveConfigV2: |
    applications:
    - name: llm_app
      import_path: ray.serve.llm:build_openai_app
      route_prefix: "/"
      runtime_env:
        working_dir: "https://github.com/damontfgz/ray-examples/archive/refs/heads/main.zip"
        pip:
          - vllm==0.7.2
          - xgrammar==0.1.11
          - pynvml==12.0.0
      args:
        llm_configs:
          - model_loading_config:
              model_id: tinyllama-1.1b
              model_source: TinyLlama/TinyLlama-1.1B-Chat-v1.0
            deployment_config:
              autoscaling_config:
                min_replicas: 1
                max_replicas: 1
#    applications:
#      - name: text_ml_app
#        import_path: text_ml.app
#        route_prefix: /summarize_translate
#        runtime_env:
#          working_dir: "https://github.com/ray-project/serve_config_examples/archive/36862c251615e258a58285934c7c41cffd1ee3b7.zip"
#          pip:
#            - torch
#            - transformers
#        deployments:
#          - name: Translator
#            num_replicas: 1
#            ray_actor_options:
#              num_cpus: 0.2
#            user_config:
#              language: french
#          - name: Summarizer
#            num_replicas: 1
#            ray_actor_options:
#              num_cpus: 0.2
  rayClusterConfig:
    rayVersion: '2.46.0' # should match the Ray version in the image of the containers
    ######################headGroupSpecs#################################
    # Ray head pod template.
    headGroupSpec:
      # The `rayStartParams` are used to configure the `ray start` command.
      # See https://github.com/ray-project/kuberay/blob/master/docs/guidance/rayStartParams.md for the default settings of `rayStartParams` in KubeRay.
      # See https://docs.ray.io/en/latest/cluster/cli.html#ray-start for all available options in `rayStartParams`.
      rayStartParams:
        dashboard-host: '0.0.0.0'
      #pod template
      template:
        spec:
          containers:
            - name: ray-head
              image: rayproject/ray:2.46.0
              resources:
                limits:
                  cpu: 1
                  memory: 5Gi
                requests:
                  cpu: 1
                  memory: 5Gi
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265 # Ray dashboard
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 8000
                  name: serve
    workerGroupSpecs:
      # the pod replicas in this group typed worker
      - replicas: 1
        minReplicas: 1
        maxReplicas: 1
        # logical group name, for this called small-group, also can be functional
        groupName: small-group
        # The `rayStartParams` are used to configure the `ray start` command.
        # See https://github.com/ray-project/kuberay/blob/master/docs/guidance/rayStartParams.md for the default settings of `rayStartParams` in KubeRay.
        # See https://docs.ray.io/en/latest/cluster/cli.html#ray-start for all available options in `rayStartParams`.
        rayStartParams: {}
        #pod template
        template:
          spec:
            nodeSelector:
              cloud.google.com/gke-accelerator: nvidia-tesla-t4
            containers:
              - name: ray-worker # must consist of lower case alphanumeric characters or '-', and must start and end with an alphanumeric character (e.g. 'my-name',  or '123-abc'
                image: rayproject/ray:2.46.0
#                lifecycle:
#                  preStop:
#                    exec:
#                      command: ["/bin/sh","-c","ray stop"]
                readinessProbe:
                  exec:
                    command:
                      - bash
                      - -c
                      - wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
                resources:
                  limits:
                    cpu: 2
                    nvidia.com/gpu: 1
                    memory: 8Gi
                  requests:
                    cpu: 1
                    nvidia.com/gpu: 1
                    memory: 4Gi
